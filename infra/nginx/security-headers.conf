# =============================================================================
# infra/nginx/security-headers.conf
# Security review finding (P20, High): `add_header` is NOT inherited into a location block that
# defines its own `add_header` — nginx replaces the whole inherited set, it does not merge. Every
# HTML-serving location in conf.d/app.conf (`/index.html`, `/assets/`, the SPA fallback) sets its
# own Cache-Control `add_header`, so a single server-level block here would have silently vanished
# from all of them, shipping every page with no CSP/HSTS/X-Frame-Options/frame-ancestors — see
# PROGRESS.md's P20 entry. `include`d explicitly in each location that needs it instead, rather
# than at server level. Deliberately NOT included in `/api/`/SSE
# locations — the backend sets its own equivalent set via helmet
# (backend/src/middlewares/security.ts); duplicating it here would just produce two conflicting
# copies of each header on every API response.
# Spec: docs/spec/09 §9.11 (Table 57) · docs/spec/09 §9.16
# =============================================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://embed.tawk.to; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tawk.to; connect-src 'self' https://*.tawk.to wss://*.tawk.to https://*.sentry.io https://*.ingest.sentry.io; frame-src https://tawk.to; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
