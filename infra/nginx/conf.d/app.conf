# =============================================================================
# infra/nginx/conf.d/app.conf
# The two server blocks: 8080 (HTTP → redirect to HTTPS, plus the ACME HTTP-01 challenge path)
# and 8443 (the actual app — SPA static files + /api reverse proxy). `server_name _` (catch-all):
# the VPS firewall + Cloudflare already only forward traffic for the real domain (docs/deploy.md),
# so nginx itself does not need to know the domain name.
# Spec: docs/spec/04 §4.4 · docs/spec/10 §10.2/§10.3 (cache) · docs/spec/09 §9.16 (TLS, headers)
# =============================================================================

# ---- 8080: plain HTTP — ACME challenge + redirect everything else to HTTPS -------------------
server {
  listen 8080;
  server_name _;

  # certbot webroot method (docs/deploy.md); mounted read-only from the host.
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/acme;
  }

  # Docker HEALTHCHECK target (frontend/Dockerfile) — plain 200, no redirect, so it doesn't need
  # to also validate the (possibly self-signed, in local dev) TLS cert on 8443.
  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain always;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- 8443: HTTPS — the app ---------------------------------------------------------------------
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Maintenance mode (prompts/20 task 3): `touch infra/nginx/maintenance-control/maintenance.flag`
  # on the host (bind-mounted directory, see docker-compose.prod.yml) takes the whole site down
  # with a static page; remove the file to restore service. Checked first, ahead of every route.
  if (-f /etc/nginx/maintenance-control/maintenance.flag) {
    return 503;
  }
  error_page 503 /maintenance.html;
  location = /maintenance.html {
    root /usr/share/nginx/html-maintenance;
    internal;
  }

  client_max_body_size 2m;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Static assets: Vite's own output is content-hashed (…-<hash>.js/css), so it is safe to
  # cache for a year and treat as immutable (docs/spec/10 §10.3). index.html itself must NEVER be
  # cached, or a deploy would leave old clients pointing at asset URLs that no longer exist.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback: any non-file, non-/api route resolves to index.html (client-side router) via an
  # internal redirect that re-enters location matching — it ends up served by `= /index.html`
  # above, but this location's own `add_header` (if it ever gets one) would need the same include.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }

  # ---- /api reverse proxy (round-robin over api_upstream, defined in ../nginx.conf) -----------
  location /api/ {
    limit_req zone=api_general burst=40 nodelay;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A replica that errors/times out/502s mid-rolling-update is retried on the other one
    # transparently instead of surfacing a failure to the client (docs/spec/10 §10.5).
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
  }

  # ---- SSE: GET /api/v1/notifications/stream — long-lived, must not be buffered or timed out ---
  location = /api/v1/notifications/stream {
    limit_req zone=api_general burst=40 nodelay;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    proxy_buffering off;
    proxy_cache off;
    # X-Accel-Buffering: no — belt-and-suspenders even though proxy_buffering is already off.
    add_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }
}
