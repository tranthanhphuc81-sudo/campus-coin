# =============================================================================
# infra/nginx/nginx.conf
# Main Nginx config for the production "web" image (frontend/Dockerfile FROM
# nginxinc/nginx-unprivileged). Runs non-root, listens on 8080/8443 (unprivileged ports; the host
# maps 80/443 -> them, see docker-compose.prod.yml). Server blocks live in conf.d/app.conf.
# Spec: docs/spec/04 §4.4 (Bảng 12 nginx container) · docs/spec/10 §10.2 (gzip) ·
#   docs/spec/09 §9.16 (TLS 1.2+/1.3, real_ip only from Cloudflare)
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # nginx's stock temp paths are all under /var/cache/nginx, which does not exist under a
  # `read_only: true` root filesystem — redirect every one of them (not just the ones this app
  # actually uses) under /tmp, backed by docker-compose.prod.yml's small tmpfs mount. Verified
  # against a real run: nginx fails to start with "mkdir() … Read-only file system" the moment ANY
  # of these five is left at its default, even proxy types this config never uses (uwsgi/scgi) —
  # nginx initializes all of them unconditionally at startup.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Security review finding (P20, Medium): the obvious `'"$request" … "$http_referer"'` log_format
  # would put a live secret in plain sight in every access log line — `$request` includes the full
  # query string (`GET /reset-password?token=… HTTP/1.1`, `GET /api/v1/notifications/stream?ticket=…`),
  # and `$http_referer` is the full URL of whatever page linked here, which for the follow-up API
  # call FROM one of those pages is that same token-bearing URL. `$uri` (path only, no query) and
  # dropping referer entirely avoid both — matches docs/spec/09 §9.12 (never log secrets/tokens).
  log_format main
    '$remote_addr - $status "$request_method $uri" $body_bytes_sent '
    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
  # $remote_addr is the REAL client IP once real_ip is applied (see cloudflare-real-ip.conf).
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # ---- Compression (docs/spec/10 §10.2) -----------------------------------------------------
  # Brotli needs a non-stock nginx build (ngx_brotli); deferred — see docs/deploy.md's "Known
  # limitations". gzip alone still gets hashed JS/CSS/JSON responses most of the way there.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/xml application/xml+rss
    application/json application/javascript text/javascript image/svg+xml
    application/problem+json font/woff2;

  # ---- TLS (docs/spec/09 §9.16: TLS 1.2+/1.3 only) ------------------------------------------
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ---- Rate limiting (Bảng from prompts/20: 20 r/s, burst 40) -------------------------------
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_status 429;

  # ---- Upstream (2 API replicas, rolling-update-friendly) -----------------------------------
  # max_fails/fail_timeout = nginx's passive health check: 3 failed proxy attempts within 10s
  # take that replica out of rotation for 10s, so a mid-rollout instance still starting is skipped
  # instead of serving 502s to real users (proxy_next_upstream in app.conf covers this too).
  upstream api_upstream {
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
  }

  # Only trust X-Forwarded-*/CF-Connecting-IP from Cloudflare's own edge IPs (docs/spec/09 §9.16).
  include /etc/nginx/cloudflare-real-ip.conf;

  include /etc/nginx/conf.d/*.conf;
}
