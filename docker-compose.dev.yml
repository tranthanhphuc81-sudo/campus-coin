services:
  mysql:
    image: mysql:8.4
    container_name: campus-coin-mysql-dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_coin
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus123
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - campus_coin_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    container_name: campus-coin-mailpit-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  campus_coin_mysql_data:
