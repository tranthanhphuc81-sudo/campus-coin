openapi: 3.1.0
info:
  title: CampusCoin API
  version: 0.1.0
  description: CampusCoin ("Smart Spending, Student Style") REST API. Money amounts are decimal strings (never floats); errors follow RFC 9457 `application/problem+json`; every route scoped to the caller's own data returns 404 (not 403) for another user's resource.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Short-lived access token (EdDSA JWT) from `POST /auth/login`, sent as `Authorization: Bearer <token>`."
  schemas:
    adminAuditLogQuerySchema:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        action:
          type: string
          minLength: 1
          maxLength: 80
        actorId:
          type: string
          minLength: 1
          maxLength: 64
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      additionalProperties: false
    adminLoginSchema:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    aiFeedbackSchema:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        merchantKey:
          type: string
          minLength: 1
          maxLength: 255
        suggestedCategoryId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        chosenCategoryId:
          type: integer
          exclusiveMinimum: 0
      required:
        - merchantKey
        - suggestedCategoryId
        - chosenCategoryId
      additionalProperties: false
    bookmarkIdParamSchema:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{1,10}$
      required:
        - id
      additionalProperties: false
    budgetMonthSchema:
      type: string
      pattern: ^(\d{4})-(\d{2})-(\d{2})$
    budgetUpsertItemSchema:
      type: object
      properties:
        categoryId:
          type: integer
          exclusiveMinimum: 0
        limitAmount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        alertThresholdPct:
          type: integer
          minimum: 50
          maximum: 100
          default: 80
      required:
        - categoryId
        - limitAmount
      additionalProperties: false
    categorizeSuggestSchema:
      type: object
      properties:
        description:
          type: string
          minLength: 2
          maxLength: 255
        type:
          type: string
          enum:
            - income
            - expense
      required:
        - description
        - type
      additionalProperties: false
    categoryNameSchema:
      type: string
      minLength: 1
    changePasswordSchema:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    copyPreviousBudgetsSchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      required:
        - month
      additionalProperties: false
    createAnnouncementSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 1000
        level:
          type: string
          enum:
            - info
            - warning
        startsAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - title
        - body
        - level
        - startsAt
      additionalProperties: false
    createBookmarkSchema:
      oneOf:
        - type: object
          properties:
            targetType:
              type: string
              enum:
                - tip
            targetRef:
              type: string
              pattern: ^\d{1,20}$
            note:
              type:
                - string
                - "null"
              maxLength: 500
          required:
            - targetType
            - targetRef
          additionalProperties: false
        - type: object
          properties:
            targetType:
              type: string
              enum:
                - insight
            targetRef:
              type: string
              pattern: ^(\d{4})-(\d{2})-(\d{2})$
            note:
              type:
                - string
                - "null"
              maxLength: 500
          required:
            - targetType
            - targetRef
          additionalProperties: false
        - type: object
          properties:
            targetType:
              type: string
              enum:
                - report
            targetRef:
              type: string
              maxLength: 255
              pattern: ^(overview|by-period|by-category|forecast)(\?[A-Za-z0-9=&,-]+)?$
            note:
              type:
                - string
                - "null"
              maxLength: 500
          required:
            - targetType
            - targetRef
          additionalProperties: false
    createCategorySchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - income
            - expense
        icon:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
      required:
        - name
        - type
      additionalProperties: false
    createRecurringRuleSchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: integer
          exclusiveMinimum: 0
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        description:
          type:
            - string
            - "null"
          maxLength: 255
        frequency:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
        dayOfMonth:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
        dayOfWeek:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 7
        startDate:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        endDate:
          type:
            - string
            - "null"
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      required:
        - type
        - categoryId
        - amount
        - frequency
        - startDate
      additionalProperties: false
    createTipTemplateSchema:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        ruleType:
          type: string
          enum:
            - over_budget
            - above_average
            - small_frequent
            - subscriptions
            - savings_gap
            - weekend_spike
            - general
        titleTpl:
          type: string
          minLength: 1
          maxLength: 150
        bodyTpl:
          type: string
          minLength: 1
          maxLength: 500
        isActive:
          type: boolean
          default: true
      required:
        - code
        - ruleType
        - titleTpl
        - bodyTpl
      additionalProperties: false
    createTransactionSchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: integer
          exclusiveMinimum: 0
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        txnDate:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        description:
          type:
            - string
            - "null"
          maxLength: 255
        aiSuggestedCategoryId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        aiConfidence:
          type:
            - string
            - "null"
          pattern: ^(0(\.\d{1,3})?|1(\.0{1,3})?)$
        recurring:
          type: object
          properties:
            frequency:
              type: string
              enum:
                - weekly
                - monthly
                - yearly
            intervalCount:
              type: integer
              minimum: 1
              maximum: 12
              default: 1
            endDate:
              type:
                - string
                - "null"
              pattern: ^(\d{4})-(\d{2})-(\d{2})$
          required:
            - frequency
          additionalProperties: false
      required:
        - type
        - categoryId
        - amount
        - txnDate
      additionalProperties: false
    dashboardSummaryQuerySchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      additionalProperties: false
    deleteAccountSchema:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
        confirm:
          type: string
          enum:
            - DELETE
      required:
        - password
        - confirm
      additionalProperties: false
    deleteCategoryQuerySchema:
      type: object
      properties:
        reassignTo:
          type: string
          pattern: ^\d{1,10}$
        archive:
          type: string
          enum:
            - "true"
            - "false"
      additionalProperties: false
    emailOnlySchema:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
      required:
        - email
      additionalProperties: false
    emailSchema:
      type: string
      maxLength: 254
    exportQuerySchema:
      type: object
      properties:
        format:
          type: string
          enum:
            - json
            - csv
          default: json
      additionalProperties: false
    forecastQuerySchema:
      type: object
      properties: {}
      additionalProperties: false
    importBatchQuerySchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        filter:
          type: string
          enum:
            - all
            - errors
            - duplicates
            - needs_review
          default: all
      additionalProperties: false
    importColumnMappingSchema:
      type: object
      properties:
        date:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 49
        amount:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 49
        type:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 49
        description:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 49
        category:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 49
      required:
        - date
        - amount
        - type
        - description
        - category
      additionalProperties: false
    insightMonthParamSchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      required:
        - month
      additionalProperties: false
    intIdParamSchema:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{1,10}$
      required:
        - id
      additionalProperties: false
    listAdminUsersQuerySchema:
      type: object
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 254
        status:
          type: string
          enum:
            - pending
            - active
            - disabled
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      additionalProperties: false
    listBookmarksQuerySchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - tip
            - insight
            - report
        q:
          type: string
          minLength: 1
          maxLength: 100
        page:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      additionalProperties: false
    listBudgetsQuerySchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      additionalProperties: false
    listCategoriesQuerySchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        includeInactive:
          type: string
          enum:
            - "true"
            - "false"
      additionalProperties: false
    listInsightsQuerySchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      additionalProperties: false
    listNotificationsQuerySchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        unreadOnly:
          type: string
          enum:
            - "true"
            - "false"
          default: "false"
      additionalProperties: false
    listTransactionsQuerySchema:
      type: object
      properties:
        from:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        to:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: string
          pattern: ^\d{1,10}(,\d{1,10}){0,19}$
        q:
          type: string
          minLength: 1
          maxLength: 100
        minAmount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        maxAmount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        sort:
          type: string
          enum:
            - txnDate
            - -txnDate
            - amount
            - -amount
            - createdAt
            - -createdAt
          default: -txnDate
        page:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        deleted:
          type: string
          enum:
            - "true"
            - "false"
          default: "false"
      additionalProperties: false
    localDateSchema:
      type: string
      pattern: ^(\d{4})-(\d{2})-(\d{2})$
    loginSchema:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
      required:
        - email
        - password
      additionalProperties: false
    mfaTokenSchema:
      type: string
      maxLength: 2000
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
    mfaVerifySchema:
      type: object
      properties:
        mfaToken:
          type: string
          maxLength: 2000
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - mfaToken
      additionalProperties: false
    moneyFilterSchema:
      type: string
      pattern: ^\d{1,12}(\.\d{1,2})?$
    moneyStringSchema:
      type: string
      pattern: ^\d{1,12}(\.\d{1,2})?$
    noHtmlSchema:
      type: string
    passwordSchema:
      type: string
      minLength: 10
      maxLength: 128
    previewTipTemplateSchema:
      type: object
      properties:
        titleTpl:
          type: string
          minLength: 1
          maxLength: 150
        bodyTpl:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - titleTpl
        - bodyTpl
      additionalProperties: false
    recentActivityQuerySchema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      additionalProperties: false
    recurringInlineSchema:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
        endDate:
          type:
            - string
            - "null"
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      required:
        - frequency
      additionalProperties: false
    registerSchema:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
      required:
        - fullName
        - email
        - password
      additionalProperties: false
    reportCategoryBreakdownQuerySchema:
      type: object
      properties:
        from:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        to:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: string
          pattern: ^\d{1,10}(,\d{1,10}){0,19}$
      required:
        - from
        - to
      additionalProperties: false
    reportDailyWeeklyQuerySchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
      additionalProperties: false
    reportIncomeVsExpenseQuerySchema:
      type: object
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 24
          default: 6
      additionalProperties: false
    reportMonthlyExportQuerySchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        format:
          type: string
          enum:
            - pdf
          default: pdf
      additionalProperties: false
    reportShareSchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        toEmail:
          type: string
          maxLength: 254
        message:
          type: string
          maxLength: 500
      required:
        - toEmail
      additionalProperties: false
    reportTargetRefSchema:
      type: string
      maxLength: 255
      pattern: ^(overview|by-period|by-category|forecast)(\?[A-Za-z0-9=&,-]+)?$
    resetPasswordSchema:
      type: object
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
      required:
        - token
        - newPassword
      additionalProperties: false
    resolveFlagSchema:
      type: object
      properties:
        flag:
          type: string
          enum:
            - anomaly
            - duplicate
        action:
          type: string
          enum:
            - keep
            - delete
      required:
        - flag
        - action
      additionalProperties: false
    tipIdParamSchema:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{1,20}$
      required:
        - id
      additionalProperties: false
    tipTemplateCodeSchema:
      type: string
      pattern: ^[A-Z0-9_]{1,40}$
    tokenSchema:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
    updateAnnouncementSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 1000
        level:
          type: string
          enum:
            - info
            - warning
        startsAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - "null"
          format: date-time
        isActive:
          type: boolean
      additionalProperties: false
    updateBookmarkSchema:
      type: object
      properties:
        note:
          type:
            - string
            - "null"
          maxLength: 500
      additionalProperties: false
    updateCategorySchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        icon:
          type:
            - string
            - "null"
          pattern: ^[a-z0-9-]{1,40}$
        color:
          type:
            - string
            - "null"
          pattern: ^#[0-9A-Fa-f]{6}$
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 32767
      additionalProperties: false
    updateImportRowsSchema:
      type: object
      properties:
        options:
          type: object
          properties:
            dateFormat:
              type: string
              enum:
                - YYYY-MM-DD
                - DD/MM/YYYY
                - MM/DD/YYYY
            mapping:
              type: object
              properties:
                date:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 49
                amount:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 49
                type:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 49
                description:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 49
                category:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 49
              required:
                - date
                - amount
                - type
                - description
                - category
              additionalProperties: false
          additionalProperties: false
        rows:
          type: array
          items:
            type: object
            properties:
              rowNumber:
                type: integer
                minimum: 2
              categoryId:
                type: integer
                exclusiveMinimum: 0
              selected:
                type: boolean
            required:
              - rowNumber
            additionalProperties: false
          maxItems: 200
        setAllSelected:
          type: boolean
      additionalProperties: false
    updateProfileSchema:
      type: object
      properties:
        fullName:
          type: string
        academicYear:
          type:
            - string
            - "null"
          enum:
            - year_1
            - year_2
            - year_3
            - year_4
            - year_5
            - postgraduate
            - other
            - null
        monthlyAllowanceBaseline:
          type:
            - string
            - "null"
          pattern: ^\d{1,12}(\.\d{1,2})?$
        monthlySavingsGoal:
          type:
            - string
            - "null"
          pattern: ^\d{1,12}(\.\d{1,2})?$
        currency:
          type: string
          enum:
            - USD
            - VND
        timezone:
          type: string
        preferences:
          type: object
          properties:
            theme:
              type: string
              enum:
                - light
                - dark
                - system
            fontScale:
              type: number
              minimum: 0.875
              maximum: 1.5
            locale:
              type: string
              enum:
                - en
          additionalProperties: false
        aiOptIn:
          type: boolean
      additionalProperties: false
    updateRecurringRuleSchema:
      type: object
      properties:
        categoryId:
          type: integer
          exclusiveMinimum: 0
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        description:
          type:
            - string
            - "null"
          maxLength: 255
        frequency:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
          minimum: 1
          maximum: 12
        dayOfMonth:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
        dayOfWeek:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 7
        endDate:
          type:
            - string
            - "null"
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        isActive:
          type: boolean
      additionalProperties: false
    updateTipTemplateSchema:
      type: object
      properties:
        titleTpl:
          type: string
          minLength: 1
          maxLength: 150
        bodyTpl:
          type: string
          minLength: 1
          maxLength: 500
        isActive:
          type: boolean
      additionalProperties: false
    updateTransactionSchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - income
            - expense
        categoryId:
          type: integer
          exclusiveMinimum: 0
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        txnDate:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        description:
          type:
            - string
            - "null"
          maxLength: 255
        aiSuggestedCategoryId:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        aiConfidence:
          type:
            - string
            - "null"
          pattern: ^(0(\.\d{1,3})?|1(\.0{1,3})?)$
        version:
          type: integer
          minimum: 1
      required:
        - version
      additionalProperties: false
    upsertBudgetsSchema:
      type: object
      properties:
        month:
          type: string
          pattern: ^(\d{4})-(\d{2})-(\d{2})$
        budgets:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: integer
                exclusiveMinimum: 0
              limitAmount:
                type: string
                pattern: ^\d{1,12}(\.\d{1,2})?$
              alertThresholdPct:
                type: integer
                minimum: 50
                maximum: 100
                default: 80
            required:
              - categoryId
              - limitAmount
            additionalProperties: false
          minItems: 1
          maxItems: 200
      required:
        - month
        - budgets
      additionalProperties: false
    uuidParamSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
      additionalProperties: false
    verifyEmailSchema:
      type: object
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      required:
        - token
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: Machine-readable error slug, e.g. "validation-failed".
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
          description: Present on 422 validation-failed responses, one entry per invalid field.
      required:
        - type
        - title
        - status
      description: RFC 9457 application/problem+json body.
    SessionIdParam:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
      additionalProperties: false
    NotificationIdParam:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{1,20}$
      required:
        - id
      additionalProperties: false
    TipIdParam:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{1,20}$
      required:
        - id
      additionalProperties: false
    AdminCategoriesQuery:
      type: object
      properties:
        type:
          type: string
          enum:
            - income
            - expense
      additionalProperties: false
    AdminCategoryDeleteQuery:
      type: object
      properties:
        archive:
          type: string
          enum:
            - "true"
            - "false"
      additionalProperties: false
  parameters: {}
